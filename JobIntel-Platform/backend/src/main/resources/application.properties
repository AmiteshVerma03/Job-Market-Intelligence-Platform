server.port=8080
spring.application.name=jobApp

# Database — set these as environment variables, never hardcode
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_analyzer}
spring.datasource.username=${DB_USERNAME:user1}
spring.datasource.password=${DB_PASSWORD:kiit}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT — set as environment variable in production
jwt.secret=${JWT_SECRET:ThisIsMyVerySecretKeyThatIsLongEnoughForHS256Algorithm123}
jwt.expiration-ms=3600000

# Do NOT expose raw exception messages to clients
server.error.include-message=never
